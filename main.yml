name: BTC 30min Update

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests pandas numpy

      - name: Lancer le pipeline BTC
        run: python btc_pipeline.py

      - name: Commit et push btc_dashboard.json
        run: |
          git config --global user.name  "btc-bot"
          git config --global user.email "btc-bot@github.com"
          git add btc_dashboard.json
          git commit -m "data: $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "No changes"
          git push
